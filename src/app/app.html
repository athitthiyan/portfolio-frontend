<!-- NAVIGATION -->
<nav class="navbar">
  <div class="navbar-container">
    <div class="navbar-brand" (click)="scrollTo('home')">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <path d="M12 6v6l4 2"></path>
      </svg>
      <span class="brand-text">Athitthiyan</span>
    </div>

    <div class="nav-links desktop">
      <a class="nav-link" (click)="scrollTo('home')">Home</a>
      <a class="nav-link" (click)="scrollTo('services')">Services</a>
      <a class="nav-link" (click)="scrollTo('projects')">Projects</a>
      <a class="nav-link" (click)="scrollTo('about')">About</a>
      <a class="nav-link" (click)="scrollTo('contact')">Contact</a>
    </div>

    <button class="mobile-toggle" (click)="toggleNav()" [class.active]="isNavOpen()">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>

  @if (isNavOpen()) {
    <div class="nav-menu mobile">
      <a class="nav-link" (click)="scrollTo('home')">Home</a>
      <a class="nav-link" (click)="scrollTo('services')">Services</a>
      <a class="nav-link" (click)="scrollTo('projects')">Projects</a>
      <a class="nav-link" (click)="scrollTo('about')">About</a>
      <a class="nav-link" (click)="scrollTo('contact')">Contact</a>
    </div>
  }
</nav>
